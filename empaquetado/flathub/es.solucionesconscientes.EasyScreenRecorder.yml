# Flathub manifest for Easy Screen Recorder.
#
# Comments in English on purpose, unlike the rest of this repository: this file
# is copied verbatim into flathub/flathub and its readers are Flathub
# reviewers. Everything here is explained where it is decided, because every
# unusual line in a manifest costs a reviewer a question.
app-id: es.solucionesconscientes.EasyScreenRecorder
runtime: org.kde.Platform
# 6.9 is EOL and the linter warns it will become an error. Verified building
# against org.kde.Sdk//6.11.
runtime-version: '6.11'
sdk: org.kde.Sdk
command: easy-screen-recorder

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Without this the QML interface falls back to software rendering. Measured
  # on the first sandbox build: "MESA: error: ZINK: failed to choose pdev" plus
  # a row of EGL warnings, because /dev/dri was not there. Capture itself is
  # unaffected — that runs on the host, with its own access — but an interface
  # burning CPU, in an app whose whole point is not burning CPU, is absurd.
  - --device=dri

  # The camera preview needs to see the camera from INSIDE the sandbox, and
  # --device=all is the only value that exposes it: dri, input and usb were all
  # tested and none of them bring /dev/videoN in.
  #
  # Note what this is NOT for. The recording never needs it: the camera is
  # captured by gpu-screen-recorder, which runs on the host with its own access.
  # This permission exists only so you can see yourself and frame the shot
  # BEFORE you start, which is the one moment it matters — once recording
  # starts, the camera belongs to the recorder and the preview goes dark,
  # because a V4L2 camera admits a single client.
  #
  # The narrower alternative is the camera portal, which hands out a PipeWire
  # stream instead of the device. Qt's V4L2 camera backend does not consume it,
  # so it is not an option today. If that changes, this line goes away.
  - --device=all

  # Audio-only mode records through PipeWire/pulse.
  - --socket=pulseaudio

  # Recordings go to the user's own folders: Videos and Music by default, or
  # wherever they pick. xdg-videos/xdg-music cover the defaults; the folder
  # chooser uses the portal for anything else.
  - --filesystem=xdg-videos
  - --filesystem=xdg-music

  # The recording session — gpu-screen-recorder's IPC socket, its pid and its
  # log — lives here, and both sides have to see the same path.
  - --filesystem=~/.cache/easy-screen-recorder:create

  # THE PERMISSION THAT NEEDS A REVIEW, and the reason for it:
  #
  # The capture is done by a HOST process on purpose. gpu-screen-recorder
  # (GPL-3.0-only) is launched with command-line arguments and controlled over a
  # unix socket. It is not linked, not vendored and not redistributed, so it has
  # to be installed on the host — and reaching it from inside the sandbox means
  # flatpak-spawn --host, which needs this.
  #
  # Without host access there is no GPU capture, which is the only reason this
  # app exists. Verified: built from the public tag, installed, and recording
  # from inside the sandbox with GSR running on the host.
  - --talk-name=org.freedesktop.Flatpak

  # The tray icon. Qt registers a StatusNotifierItem with this watcher, and
  # without the permission the registration silently fails: the icon never
  # appears and the only trace is one line on stderr, "KDE platform plugin is
  # loaded but SNI unavailable".
  #
  # That was not cosmetic. The window steps aside while recording so it does not
  # end up in the video, and the tray icon was how you got it back — so on the
  # first installed build the app simply vanished when you pressed Record.
  # Verified both ways on Plasma 6 / Wayland: without the line the watcher lists
  # no item for us, with it the item registers and the warning is gone.
  #
  # StatusNotifierWatcher is a freedesktop spec that KDE named; GNOME needs an
  # extension for it. Where nothing implements it the window is still reachable,
  # because it is minimised and not hidden.
  - --talk-name=org.kde.StatusNotifierWatcher

  # The global shortcut talks to kglobalaccel, which is a KDE Plasma service.
  #
  # The app does NOT require Plasma: it runs on any desktop, on Wayland and on
  # X11. This permission only enables the global shortcut where that service
  # exists; where it does not, the shortcut is simply never registered and
  # nothing else changes.
  #
  # It is requested because org.freedesktop.portal.GlobalShortcuts is not yet
  # reliably deployed. Once it is, this line is replaced by the portal and the
  # permission goes away.
  - --talk-name=org.kde.kglobalaccel

modules:
  - name: easy-screen-recorder
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      # Tag AND commit, not just the tag: a tag can be moved and a commit
      # cannot, and what gets published has to be reproducible.
      - type: git
        url: https://github.com/solucionesconscientes/easy-screen-recorder.git
        tag: v0.6.0
        commit: 344e94751f17e6dac8ffa736262a143246d122a2
