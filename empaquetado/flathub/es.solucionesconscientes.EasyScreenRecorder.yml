# Manifiesto de Flathub para Easy Screen Recorder. BORRADOR: la licencia ya
# esta resuelta (GPL-3.0-or-later), pero queda el bloqueo de lanzar GSR desde
# dentro del sandbox, con su verificacion. Ver NOTAS.md.
app-id: es.solucionesconscientes.EasyScreenRecorder
runtime: org.kde.Platform
# 6.11: la 6.9 esta EOL y el linter de Flathub avisa de que pasara a error.
# Cambiado a ciegas: construir para comprobarlo exige bajar el SDK de KDE
# (~2 GB) y no se ha hecho aqui. Verificar en la primera construccion real.
runtime-version: '6.11'
sdk: org.kde.Sdk
command: easy-screen-recorder

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # El audio: el modo solo-audio graba por PipeWire/pulse.
  - --socket=pulseaudio
  # Las grabaciones van a las carpetas del usuario (Videos y Musica por
  # defecto, u otra elegida). xdg-videos/xdg-music cubren el default; el
  # dialogo de carpeta usa el portal para el resto.
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  # La sesion de grabacion (socket IPC de GSR, pid, log) vive en
  # ~/.cache/easy-screen-recorder y la tienen que ver los dos lados.
  - --filesystem=~/.cache/easy-screen-recorder:create
  # Para lanzar gpu-screen-recorder EN EL ANFITRION via flatpak-spawn.
  # Es el permiso gordo de este manifiesto; NOTAS.md explica por que no hay
  # alternativa mientras la captura viva en un proceso del anfitrion.
  - --talk-name=org.freedesktop.Flatpak
  # El atajo global habla con kglobalaccel.
  - --talk-name=org.kde.kglobalaccel

modules:
  - name: easy-screen-recorder
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      # Para el envio real: url + tag + commit del repositorio publico.
      - type: dir
        path: ../..
