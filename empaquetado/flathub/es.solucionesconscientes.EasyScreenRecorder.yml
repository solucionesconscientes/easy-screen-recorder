# Manifiesto de Flathub para Easy Screen Recorder.
#
# Construido, instalado y GRABANDO desde dentro del sandbox el 2026-09-16, con
# GSR lanzado en el anfitrion por flatpak-spawn. Lo que falta para el envio no
# es tecnico: son las capturas de pantalla. Ver NOTAS.md.
app-id: es.solucionesconscientes.EasyScreenRecorder
runtime: org.kde.Platform
# La 6.9 esta EOL y el linter avisaba de que pasaria a error. Verificado
# construyendo con org.kde.Sdk//6.11.
runtime-version: '6.11'
sdk: org.kde.Sdk
command: easy-screen-recorder

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Sin esto la UI de QML se dibuja en software. Medido al construir el flatpak
  # por primera vez: «MESA: error: ZINK: failed to choose pdev» y el resto de
  # avisos de EGL, porque /dev/dri no estaba. La captura no se ve afectada —la
  # hace GSR en el anfitrion, con su propio acceso— pero una interfaz que se
  # dibuja en CPU en una aplicacion que presume de no gastar CPU es absurda.
  - --device=dri
  # El audio: el modo solo-audio graba por PipeWire/pulse.
  - --socket=pulseaudio
  # Las grabaciones van a las carpetas del usuario (Videos y Musica por
  # defecto, u otra elegida). xdg-videos/xdg-music cubren el default; el
  # dialogo de carpeta usa el portal para el resto.
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  # La sesion de grabacion (socket IPC de GSR, pid, log) vive en
  # ~/.cache/easy-screen-recorder y la tienen que ver los dos lados.
  - --filesystem=~/.cache/easy-screen-recorder:create
  # Para lanzar gpu-screen-recorder EN EL ANFITRION via flatpak-spawn.
  # Es el permiso gordo de este manifiesto; NOTAS.md explica por que no hay
  # alternativa mientras la captura viva en un proceso del anfitrion.
  - --talk-name=org.freedesktop.Flatpak
  # El atajo global habla con kglobalaccel, que es de KDE Plasma.
  #
  # La aplicacion NO exige Plasma: funciona en cualquier escritorio y sobre
  # Wayland y X11. Este permiso solo habilita el atajo global donde ese servicio
  # existe; donde no, no se registra y no pasa nada mas. Se pide porque el
  # portal de atajos globales (org.freedesktop.portal.GlobalShortcuts) todavia
  # no esta desplegado de forma fiable; cuando lo este, esta linea se cambia por
  # el portal y el permiso desaparece.
  - --talk-name=org.kde.kglobalaccel

modules:
  - name: easy-screen-recorder
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      # url + tag + commit, que es lo que Flathub exige: construye SIN RED, asi
      # que la fuente tiene que ser publica y estar fijada. El commit va junto
      # al tag a proposito: un tag se puede mover, un commit no, y lo que se
      # publica tiene que ser reproducible.
      #
      # OJO con una trampa circular: este fichero NO puede fijar el hash de su
      # propio commit. No hace falta, porque el manifiesto que Flathub construye
      # vive en el repositorio flathub/flathub, no aqui; esta copia es la
      # plantilla que se envia. Asi que el commit fijado es el ultimo con codigo
      # —y es donde apunta v0.1.0—, y los commits que solo tocan esta plantilla
      # van despues sin afectar a lo que se construye.
      - type: git
        url: https://github.com/solucionesconscientes/easy-screen-recorder.git
        tag: v0.1.0
        commit: 1d0ad84039bf24fed7d085465c986c1512a2cc42
